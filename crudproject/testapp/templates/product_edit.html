

<form action="" method="post">
    {% csrf_token %}

    <label for="product_name">Product Name</label>
    <input type="text"  name="product_name" value="{{ product.product_name }}" required>
    <label for="category">Category</label>
    <input type="text"  name="category" value="{{ product.category }}" required>
    <label for="price">Price</label>
    <input type="number"  name="price" value="{{ product.price }}" required>
    <label for="quantity">Quantity</label>
    <input type="number" id="quantity" name="quantity" value="{{ product.quantity }}" required>
    <label for="supplier">Supplier</label>
    <input type="text"  name="supplier" value="{{ product.supplier }}" required>
    <label for="minimum_stock_level">Minimum Stock Level</label>
    <input type="number"  name="minimum_stock_level" value="{{ product.minimum_stock_level}}" required>
    <button type="submit">update</button>
</form>
